{% extends "base.html" %}
{% block content %}
<h1>Settings / Admin</h1>
<h2>Recent sessions (selection traces)</h2>
<table>
<tr><th>session</th><th>mode</th><th>created</th><th>seed</th><th>algo</th><th></th></tr>
{% for s in sessions %}
<tr><td><code>{{ s.id }}</code></td><td>{{ s.mode }}</td><td>{{ s.created_at[:19] }}</td><td><code>{{ s.seed[:18] }}</code></td><td>{{ s.algo_version }}</td><td><a href="/admin/why/{{ s.id }}">why selected?</a></td></tr>
{% endfor %}
</table>
{% endblock %}
