name: Temp Metrics
on: [push]
permissions:
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install radon
      - run: radon cc -s satprep/reports.py satprep/server.py satprep/db.py
      - run: radon mi -s satprep/reports.py satprep/server.py satprep/db.py
