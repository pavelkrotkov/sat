name: Finalize Issue 57
on:
  push:
    branches: [ fix/57-coaching-review ]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/57-coaching-review
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - name: Restore legacy report generator and wire coaching renderer
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          path = Path("satprep/reports.py")
          text = subprocess.check_output(
              ["git", "show", "origin/main:satprep/reports.py"], text=True
          )
          anchor = "from .db import connect, db_context\n"
          text = text.replace(anchor, anchor + "from .report_coaching import render_report\n", 1)
          projection = re.compile(
              r"SELECT a\.id AS attempt_id, a\.chosen_letter, a\.correct, a\.confidence, a\.time_ms,\n"
              r"\s+a\.mode, a\.attempted_at, q\.fingerprint, q\.source_test,\n"
              r"\s+q\.source_question_number, q\.module, q\.passage, q\.stem,\n"
              r"\s+q\.choices_json, q\.correct_letter, q\.rationale,\n"
              r"\s+q\.official_domain, q\.official_skill, q\.difficulty"
          )
          replacement = """SELECT a.id AS attempt_id, a.question_id, a.chosen_letter, a.correct,
                  a.confidence, a.time_ms, a.mode, a.attempted_at, a.error_tags,
                  a.self_report_reason, q.fingerprint, q.source_test,
                  q.source_question_number, q.module, q.passage, q.stem,
                  q.choices_json, q.correct_letter, q.rationale,
                  q.official_domain, q.official_skill, q.difficulty"""
          text, count = projection.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"eligible-row projection replacements: {count}")
          text, count = re.subn(
              r"        _render_report\(\n\s+rows,\n",
              "        render_report(\n            conn,\n            rows,\n",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"render call replacements: {count}")
          path.write_text(text)

          test = Path("tests/test_issue57_coaching.py")
          body = test.read_text()
          if "report_coaching as coaching_mod" not in body:
              body = body.replace(
                  "from satprep import reports as reports_mod\n",
                  "from satprep import report_coaching as coaching_mod\nfrom satprep import reports as reports_mod\n",
                  1,
              )
          body = body.replace(
              'monkeypatch.setattr(\n        reports_mod,\n        "explain_error",',
              'monkeypatch.setattr(\n        coaching_mod,\n        "explain_error",',
              1,
          )
          test.write_text(body)
          PY
      - name: Format and lint touched Python
        run: |
          uv run ruff check --fix satprep/report_coaching.py satprep/reports.py tests/test_issue57_coaching.py
          uv run ruff format satprep/report_coaching.py satprep/reports.py tests/test_issue57_coaching.py
          uv run ruff check satprep/report_coaching.py satprep/reports.py tests/test_issue57_coaching.py
      - name: Test
        run: uv run pytest -q
      - name: Complexity
        run: |
          uv pip install radon
          uv run radon cc -s satprep/report_coaching.py
          uv run radon mi -s satprep/report_coaching.py satprep/reports.py
      - name: Remove temporary workflows and commit
        run: |
          rm -f .github/workflows/metrics-temp.yml .github/workflows/refactor57-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: isolate coaching report rendering"
          git push origin HEAD:fix/57-coaching-review
