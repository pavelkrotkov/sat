name: aislop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ai-slop-gate:
    name: AI-slop gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node (pinned major)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Deterministic gate: compare findings in changed files at HEAD and the PR
      # merge-base, then fail only new or worsened findings in changed code.
      # This keeps the legacy baseline non-blocking while enforcing configured
      # quality thresholds and rules elevated to `error`. The base is resolved
      # to the merge-base of origin/main and HEAD (checked out at the PR head), not
      # live origin/main, so concurrent merges into main after this branch
      # forked cannot sweep unrelated files into the changed set. The aislop
      # version is pinned to the reviewed baseline; never bump to `@latest`
      # without checking release notes.
      - name: Compute PR merge-base
        id: mergebase
        run: |
          MERGE_BASE="$(git merge-base origin/main HEAD)"
          echo "PR's changed files are diffed against merge-base $MERGE_BASE"
          echo "sha=$MERGE_BASE" >> "$GITHUB_OUTPUT"
      - name: Run aislop (changed code only)
        run: python scripts/aislop_changed_gate.py "${{ steps.mergebase.outputs.sha }}"
