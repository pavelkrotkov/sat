name: Validate Issue 57 Final Tree
on:
  push:
    branches: [ fix/57-coaching-review ]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run ty check --output-format=github --extra-search-path "." .
      - run: uv run pytest -q
