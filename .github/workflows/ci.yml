name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kb-lint:
    name: KB lint + retrieval index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML (transitive of MkDocs; installed directly so the
            lint script's import does not require a full MkDocs install).
        run: pip install pyyaml
      - name: Lint KB and verify committed index matches regenerated one
        run: |
          # Default mode: regenerate the index. If committed and regenerated
          # differ, the build is out of sync — fail.
          python3 scripts/check_kb.py
          git diff --exit-code kb/.kb-index.json
      - name: Lint-only mode also passes
        run: python3 scripts/check_kb.py --check

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Run the trainer test suite
        run: uv run pytest -q

  kb-build:
    name: KB build (lint-gated; full rebuild is local/controller)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lint prerequisites
        run: pip install pyyaml
      - name: Lint KB (with stale-index detection)
        run: python3 scripts/check_kb.py --check
      # The full MkDocs build requires the shared research-fabric builder at
      # /home/pavel/research-fabric/tools/wiki/build_wiki.py, which is
      # controller-host-only. The lint + index-regeneration path is the CI
      # gate; the full rebuild is exercised on the controller after merge
      # (kb/rebuild.sh).
