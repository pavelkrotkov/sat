name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kb-lint:
    name: KB lint + retrieval index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML (transitive of MkDocs; installed directly so the
            lint script's import does not require a full MkDocs install).
        run: pip install pyyaml
      - name: Lint KB and verify committed index matches regenerated one
        run: |
          # Default mode: regenerate the index. If committed and regenerated
          # differ, the build is out of sync — fail.
          python3 scripts/check_kb.py
          git diff --exit-code kb/.kb-index.json
      - name: Lint-only mode also passes
        run: python3 scripts/check_kb.py --check

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --dev
      - name: Run the trainer test suite
        run: uv run pytest -q

  kb-build:
    name: KB build (reproducible, no deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MkDocs + Material
        run: pip install mkdocs mkdocs-material
      - name: Run the build (path-independent; SAT_WIKI_BUILDER not required
            because the lint+builder runs in-process once the shared script is
            not present — we run the lint and skip the build step that needs
            the controller's research-fabric layout. CI verifies the lint
            path; the full rebuild is exercised locally and on the controller.)
        run: |
          python3 scripts/check_kb.py --check
          # Build only when the shared research-fabric builder is available;
          # the default $BUILDER path is host-specific and would 404 in CI.
          if [ -f /home/pavel/research-fabric/tools/wiki/build_wiki.py ]; then
            SAT_WIKI_BUILDER=/home/pavel/research-fabric/tools/wiki/build_wiki.py ./kb/rebuild.sh
          else
            echo "shared builder not present in CI; lint-only check is the gate"
          fi