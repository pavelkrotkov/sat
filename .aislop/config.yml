version: 1
engines:
  format: true
  lint: true
  code-quality: true
  ai-slop: true
  architecture: true
  security: true
quality:
  maxFunctionLoc: 80
  maxFileLoc: 400
  maxNesting: 5
  maxParams: 6
lint:
  typecheck: true
  expoDoctor: false
security:
  audit: true
  auditTimeout: 25000
scoring:
  weights:
    format: 0.3
    lint: 0.6
    code-quality: 0.8
    ai-slop: 1
    architecture: 1
    security: 1.5
  thresholds:
    good: 75
    ok: 50
  smoothing: 5
  maxPerRule: 40
ci:
  failBelow: 85
  format: json
# The AI-slop categories this repo exists to make mechanically difficult are
# elevated to `error` (their default is `warning`), so a diff introducing them
# fails the blocking gate instead of merely lowering a non-blocking score.
# These exactly match the issue's named failure modes:
#   - narrative/trivial/meta comments   -> ai-slop/narrative-comment, trivial-comment, meta-comment
#   - oversized functions / deep nesting -> quality.maxFunctionLoc / maxNesting (score-driven)
#   - swallowed exceptions / hidden fallbacks -> swallowed-exception, silent-recovery, hidden-fallback
#   - unfinished TODO stubs in production code -> todo-stub
rules:
  ai-slop/narrative-comment: error
  ai-slop/trivial-comment: error
  ai-slop/meta-comment: error
  ai-slop/todo-stub: error
  ai-slop/swallowed-exception: error
  ai-slop/silent-recovery: error
  ai-slop/hidden-fallback: error
# Legacy baseline noise (narrative separators in long-standing data-migration /
# parsing modules) stays visible as warning; it does not fail the --changes
# diff gate because unchanged lines are not scored. Improve it deliberately.
telemetry:
  enabled: false
