[project]
name = "satprep"
version = "0.1.0"
description = "Local-first personalized SAT R&W training system built on the scraped Bluebook history."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
satprep = "satprep.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8",
    "pyyaml>=6.0",     # KB lint script (scripts/check_kb.py) and rebuild.sh nav edit
    "ruff>=0.16.3",
    "ty>=0.0.73",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["satprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scrape_wrong_questions.py" = ["E741", "B023"]

[tool.ty.src]
exclude = [
    "tests",
    "scrape_wrong_questions.py",
]
