[project]
name = "satprep"
version = "0.1.0"
description = "Local-first personalized SAT R&W training system built on the scraped Bluebook history."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
satprep = "satprep.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8",
    "pyyaml>=6.0",     # KB lint script (scripts/check_kb.py) and rebuild.sh nav edit
    "ruff>=0.16.3",
    "ty>=0.0.73",
    "mutmut>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["satprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C901"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# C901 is enabled repo-wide with max-complexity 10. New/changed code must
# stay within it. The legacy functions exceeding 10 are individually carved
# out with a targeted `# noqa: C901` on the specific `def` line (not the whole
# file), so future code added to these modules remains subject to the gate.
# Every carve-out is documented inline at its def site. Treat these as debt
# to improve deliberately, not a pattern to extend. The changed-code gate runs
# Ruff with `--ignore-noqa` and filters only those def-site baseline lines, so
# edits inside an exempt function still fail C901.
[tool.ruff.lint.per-file-ignores]
"scrape_wrong_questions.py" = ["E741", "B023"]

[tool.ty.src]
exclude = [
    "tests",
    "scrape_wrong_questions.py",
]

[tool.mutmut]
source_paths = ["satprep/"]
pytest_add_cli_args_test_selection = ["tests/"]
# tests/test_public_repo_guard.py imports scripts.check_public_repo; mutmut
# copies only source_paths + tests into mutants/, so the scripts package must
# be copied explicitly or collection fails with ModuleNotFoundError.
also_copy = ["scripts/", "deploy/"]
# Mutmut collects every source path before applying command name filters, so
# keep the initial baseline bounded to the highest-signal module. Widen this
# list deliberately when another module is ready for mutation review.
only_mutate = ["satprep/training/composition.py"]
# Run the configured high-signal baseline (advisory, not a per-edit hook):
#   uv run mutmut run
# Inspect survivors and apply the strongest:
#   uv run mutmut results && uv run mutmut apply && uv run pytest -q
