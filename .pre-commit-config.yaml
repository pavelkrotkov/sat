# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: public-repo-guard
        name: public repository leak guard
        entry: python scripts/check_public_repo.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ty
        name: ty type check
        entry: uv run ty check --extra-search-path . .
        language: system
        pass_filenames: false
        always_run: true
